events {}

http {
    include /etc/nginx/mime.types;

    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        listen 443 ssl;
        server_name yoavk.app;

        ssl_certificate     /etc/letsencrypt/live/yoavk.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yoavk.app/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location /api/ {
            set $backend http://fvg-server:3001;
            proxy_pass $backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            set $frontend http://fvg-client:3000;
            proxy_pass $frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
