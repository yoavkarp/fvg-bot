# Local development stack: hot-reloading client + server behind nginx on port 80.
# Source is bind-mounted; node_modules live in named volumes so the host's
# (macOS) modules don't clobber the container's (linux) native binaries.
#
#   npm run dev        # from the repo root — builds nothing, just runs this

services:
  fvg-client:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - DOCKER_DEV=1          # tells vite.config to point HMR at the public :80
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    expose:
      - "5173"
    restart: unless-stopped

  fvg-server:
    image: node:22-alpine
    working_dir: /app
    # The polygon client pulls in the `websocket` package, which has bufferutil
    # & utf-8-validate as *non-optional* native deps — they must compile, so the
    # alpine container needs Python + a C toolchain (node-gyp build deps).
    command: sh -c "apk add --no-cache python3 make g++ && npm install && npm run dev"
    # Pass the root .env as environment variables rather than bind-mounting the
    # file: a single-file mount inside the ./server:/app bind mount fails under
    # Docker Desktop's virtiofs (nested mountpoint). config.ts reads process.env.
    env_file:
      - ./.env
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    expose:
      - "3001"
    restart: unless-stopped

  fvg-nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fvg-client
      - fvg-server
    restart: unless-stopped

volumes:
  client_node_modules:
  server_node_modules:
